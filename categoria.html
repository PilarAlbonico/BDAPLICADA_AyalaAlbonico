<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cipria · Productos por categoría</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="tablero">
  <aside class="lateral" id="lateral" data-seccion="ventas"></aside>

  <main class="contenido">
    <div class="encabezado">
      <div>
        <nav class="migas" aria-label="Ruta">
          <a id="miga-categorias" href="/ventas">Categorías</a> ›
          <span aria-current="page" id="miga-categoria">…</span>
        </nav>
        <h1 id="titulo">Productos</h1>
        <p class="bajada" id="bajada"></p>
      </div>
      <a class="boton-secundario" id="volver" href="/ventas">← Volver</a>
    </div>

    <section class="tarjeta tabla-scroll">
      <table class="tabla">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Talle</th>
            <th class="num">Unidades</th>
            <th class="num">Monto</th>
            <th class="num">Margen</th>
            <th>Stock</th>
          </tr>
        </thead>
        <tbody id="filas"><tr><td colspan="6" class="vacio">Cargando…</td></tr></tbody>
      </table>
      <ul class="leyenda">
        <li><span class="punto normal"></span>Normal</li>
        <li><span class="punto atencion"></span>Atención</li>
        <li><span class="punto critico"></span>Crítico</li>
      </ul>
      <p class="ayuda">Hacé clic en un producto para ver sus ventas.</p>
    </section>
  </main>

  <script src="/js/tablero.js"></script>
  <script src="/js/categoria.js"></script>
</body>
</html>
